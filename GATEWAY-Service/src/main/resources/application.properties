spring.application.name=GATEWAY-Service

server.port = 8082

eureka.client.service-url.defaultzone = http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id = servicio1
spring.cloud.gateway.routes[0].uri = lb://REST-Cliente
spring.cloud.gateway.routes[0].predicates = Path=/api/clientes/**
spring.cloud.gateway.routes[0].filters = AuthenticationFilter


spring.cloud.gateway.routes[1].id = servicio2
spring.cloud.gateway.routes[1].uri = lb://REST-Pedido
spring.cloud.gateway.routes[1].predicates = Path=/api/pedidos/**
spring.cloud.gateway.routes[1].filters = AuthenticationFilter

spring.cloud.gateway.routes[2].id = servicio3
spring.cloud.gateway.routes[2].uri = lb://REST-Producto
spring.cloud.gateway.routes[2].predicates = Path=/api/productos/**
spring.cloud.gateway.routes[2].filters = AuthenticationFilter


spring.cloud.gateway.routes[3].id = servicio4
spring.cloud.gateway.routes[3].uri = lb://REST-Repartidor
spring.cloud.gateway.routes[3].predicates = Path=/api/repartidores/**
spring.cloud.gateway.routes[3].filters = AuthenticationFilter